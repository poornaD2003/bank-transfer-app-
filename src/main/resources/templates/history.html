
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Transaction History</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            margin: 0;
            color: #263445;
        }

        header {
            background: #142d4e;
            color: white;
            padding: 22px 6%;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        h2 {
            color: #142d4e;
        }

        .account-number {
            color: #1765b3;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #edf3fa;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .failed {
            color: red;
            font-weight: bold;
        }

        .back-button {
            display: inline-block;
            background: #1765b3;
            color: white;
            padding: 11px 18px;
            border-radius: 6px;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }
    </style>
</head>

<body>

<header>
    <h1>Bank Transaction System</h1>
    <p>Account Transaction History</p>
</header>

<div class="container">

    <a th:href="@{/}" class="back-button">
        Back to Dashboard
    </a>

    <div class="section">

        <h2>Transaction History</h2>

        <p>
            Account Number:
            <span class="account-number"
                  th:text="${accountNumber}"></span>
        </p>

        <p>
            Total Successful Money Sent:
            <strong>
                LKR <span th:text="${totalSent}">0.00</span>
            </strong>
        </p>

        <div class="table-wrapper">
            <table>

                <thead>
                <tr>
                    <th>Transaction ID</th>
                    <th>From Account</th>
                    <th>To Account</th>
                    <th>Amount (LKR)</th>
                    <th>Status</th>
                    <th>Description</th>
                    <th>Date</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="transaction : ${transactions}">

                    <td th:text="${transaction.id}"></td>

                    <td th:text="${transaction.fromAccount}"></td>

                    <td th:text="${transaction.toAccount}"></td>

                    <td th:text="${transaction.amount}"></td>

                    <td>
                        <span th:if="${transaction.status.name() == 'SUCCESS'}"
                              class="success">SUCCESS</span>

                        <span th:if="${transaction.status.name() == 'FAILED'}"
                              class="failed">FAILED</span>
                    </td>

                    <td th:text="${transaction.description}"></td>

                    <td th:text="${transaction.createdAt}"></td>

                </tr>

                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="7">
                        No transaction history found for this account.
                    </td>
                </tr>

                </tbody>

            </table>
        </div>

    </div>

</div>

</body>
</html>
